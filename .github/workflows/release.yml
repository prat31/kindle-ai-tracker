# Push a tag matching VERSION (e.g. v0.4.0) to publish:
#   - a GitHub release with the install zip and the .kpkg
#   - the KPM repository on GitHub Pages (Settings → Pages → Source: GitHub Actions)
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Check the tag matches VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"

      - run: make test dist

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes \
            build/dist/kindle-ai-dashboard-*.zip \
            build/kpm-repo/packages/ai_dashboard/artifacts/*.kpkg

      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/kpm-repo

      - id: pages
        uses: actions/deploy-pages@v4
